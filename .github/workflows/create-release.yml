name: Create Release from Tag

on:
  push:
    tags:
      - 'v*.*.*'  # Matches semantic versioning tags like v1.0.0
      - 'v*.*.*-*'  # Matches pre-release tags like v1.0.0-beta

env:
  PROJECT_NAME: CE-RISE Intelligent Circular Insights Workbench
  PRIMARY_REPO_URL: https://codeberg.org/CE-RISE-software/intelligent-circular-insights

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Extract tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "${{ steps.tag.outputs.TAG_NAME }}" >/dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release Notes
        id: notes
        if: steps.check_release.outputs.EXISTS == 'false'
        run: |
          cat << EOF > release_notes.md
          ## ${PROJECT_NAME} ${{ steps.tag.outputs.TAG_NAME }}

          This GitHub release corresponds to the version tag in the [canonical Codeberg repository](${PRIMARY_REPO_URL}).

          ### Overview

          This tag contains the versioned source for the Intelligent Circular Insights Workbench.
          See [the changelog](${PRIMARY_REPO_URL}/src/tag/${{ steps.tag.outputs.TAG_NAME }}/CHANGELOG.md) for changes in this version.

          ### Documentation

          [Project documentation](${PRIMARY_REPO_URL}/src/tag/${{ steps.tag.outputs.TAG_NAME }}/docs/) is available in the tagged source.

          ---

          **Note**: This repository is a mirror. For issues and pull requests, use the [canonical Codeberg repository](${PRIMARY_REPO_URL}).
          EOF

      - name: Create GitHub Release
        if: steps.check_release.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: ${{ env.PROJECT_NAME }} ${{ steps.tag.outputs.TAG_NAME }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.TAG_NAME, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
