[project]
name = "ici-reliability"
version = "0.1.0"
description = "Confidence signals, calibrators, selective policy, risk-coverage."
requires-python = ">=3.10,<3.13"
dependencies = ["ici-core", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ici_reliability"]
