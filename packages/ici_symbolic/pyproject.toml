[project]
name = "ici-symbolic"
version = "0.1.0"
description = "OWL 2 RL forward chaining, obligation rules, traces, SHACL."
requires-python = ">=3.10,<3.13"
dependencies = ["ici-core", "rdflib>=7.1", "owlrl>=7.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ici_symbolic"]
