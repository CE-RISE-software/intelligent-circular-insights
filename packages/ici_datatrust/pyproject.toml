[project]
name = "ici-datatrust"
version = "0.1.0"
description = "Data-trust seat: latent-bias posterior. Null-implemented in this release."
requires-python = ">=3.10,<3.13"
license = { text = "EUPL-1.2" }
authors = [
    { name = "A M Esfar-E-Alam", email = "mail2turzo@gmail.com" },
    { name = "Riccardo Boero", email = "ribo@nilu.no" },
]
dependencies = ["ici-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ici_datatrust"]
