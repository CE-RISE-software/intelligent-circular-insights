[project]
name = "ici-substrates"
version = "0.1.0"
description = "Substrate registry: DPP core, CE-RISE data models, PEFDPP graph, OFF."
requires-python = ">=3.10,<3.13"
dependencies = ["ici-core", "rdflib>=7.1", "jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ici_substrates"]
