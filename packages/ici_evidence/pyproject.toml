[project]
name = "ici-evidence"
version = "0.1.0"
description = "Hybrid retrieval, context pack, persistent fact memory."
requires-python = ">=3.10,<3.13"
dependencies = ["ici-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ici_evidence"]
