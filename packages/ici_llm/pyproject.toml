[project]
name = "ici-llm"
version = "0.1.0"
description = "LLM provider, prompts, grounding verifier, cassettes. Owned by Codex."
requires-python = ">=3.10,<3.13"
dependencies = ["ici-core", "openai>=1.99.9", "jsonschema[format-nongpl]>=4.23", "PyYAML>=6"]

[project.optional-dependencies]
local = ["sentence-transformers>=5.1,<6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ici_llm"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "ici_llm/prompt_data"
"schemas" = "ici_llm/schema_data"
