[project]
name = "ici-eval"
version = "0.1.0"
description = "Evaluation harness: AURC, ECE, risk-coverage, McNemar, Wilson, figures."
requires-python = ">=3.10,<3.13"
dependencies = ["ici-core", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ici_eval"]
