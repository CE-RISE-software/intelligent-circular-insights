name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# LLM requests replay from recorded cassettes; no API key is provided.
jobs:
  check:
    runs-on: codeberg-medium
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --python 3.12 --frozen --all-packages --dev
      - run: make check
      - run: uv run pytest --cov=packages --cov-report=term-missing

  python-310:
    runs-on: codeberg-small
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/astral-sh/setup-uv@v3
      - run: uv python install 3.10
      - run: uv sync --python 3.10 --frozen --all-packages --dev
      - run: make typecheck
      - run: uv run pytest tests/unit tests/contract -q
