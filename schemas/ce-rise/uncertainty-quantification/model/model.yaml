    reported_value:
        description: "Reported value to which the uncertainty statement applies, when represented in this utility model"
        range: QuantityValue
        annotations:
            owl.filler: uq:reportedValue
            sql_identifier: "uq_reported_value"

    measurand:
        description: "Operational definition of the measurand or value of interest"
        range: MeasurandSpecification
        annotations:
            owl.filler: uq:measurand
            sql_identifier: "uq_measurand"

    probability_distribution:
        description: "Probability distribution describing uncertainty"
        range: UncertaintyDistribution
        annotations:
            owl.filler: uq:probabilityDistribution
