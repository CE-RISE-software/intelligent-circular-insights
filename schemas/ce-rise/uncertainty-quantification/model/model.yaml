    additional_uncertainty_component:
        description: "Additional uncertainty component introduced because of comparison mismatch"
        range: UncertaintyComponent
        annotations:
            owl.filler: uq:additionalUncertaintyComponent
            sql_identifier: "uq_additional_uncertainty_component"

classes:
    # Root container
    UncertaintyQuantification:
        class_uri: uq:uncertaintyQuantification
        description: "Root container for uncertainty quantification statements and supporting records"
        slots:
            - uncertainty_statements
            - uncertainty_budgets
            - propagation_analyses
            - comparison_assessments
            - method_references
            - uncertainty_evidence_references
        annotations:
            sql_identifier: "uq_root"

    # Core uncertainty statement
    UncertaintyStatement:
        class_uri: uq:uncertaintyStatement
        description: "Reusable statement describing uncertainty for a reported value, field, dataset, model output, or comparison"
        comments:
            - "Designed as the main integration point for other CE-RISE data models."
            - "Other models may either embed this class or point to it through uncertainty_statement_identifier_value."
        slots:
            - uncertainty_statement_identifier_value
            - uncertainty_statement_label_value
            - uncertainty_statement_type_value
            - uncertainty_statement_status_value
            - uncertainty_statement_date_value
            - uncertainty_applies_to_model_value
            - uncertainty_applies_to_class_value
            - uncertainty_applies_to_slot_value
            - uncertainty_applies_to_record_value
            - uncertainty_applies_to_value_path_value
            - uncertainty_applies_to_value_identifier_value
            - reported_value
            - measurand
            - probability_distribution
            - coverage_interval
            - uncertainty_budget
            - propagation_analysis
            - uncertainty_traceability_reference_value
            - uncertainty_data_quality_reference_value
            - uncertainty_evidence_reference_value
            - uncertainty_standards_applied_value
            - uncertainty_statement_notes_value
        annotations:
            references: "JCGM 100:2008; JCGM 101:2008; JCGM 200:2012; ISO/IEC 17025; ISO 5725"
            sql_identifier: "uq_statement"

    MeasurandSpecification:
        class_uri: uq:measurandSpecification
        description: "Operational specification of the measurand, quantity of interest, method, conditions, and boundary"
        slots:
            - uncertainty_measurand_identifier_value
            - uncertainty_measurand_name_value
            - uncertainty_measurand_description_value
            - uncertainty_quantity_kind_value
            - uncertainty_quantity_unit_value
            - object_or_matrix_value
            - sample_definition_value
            - sampling_frame_value
            - measurement_method_value
            - method_version_value
            - method_standard_value
            - measurement_model_value
            - system_boundary_value
            - reference_conditions_value
            - uncertainty_environmental_conditions_value
            - corrections_applied_value
            - rounding_rule_value
            - decision_rule_value
            - uncertainty_traceability_reference_value
        annotations:
            references: "JCGM 200:2012; JCGM 100:2008; ISO/IEC 17025"
            sql_identifier: "uq_measurand_spec"

    QuantityValue:
        class_uri: uq:quantityValue
        description: "Reported value or estimate associated with an uncertainty statement"
        slots:
            - numeric_value_value
            - text_value_value
            - uncertainty_unit_value
            - value_type_value
            - value_timestamp_value
            - value_source_value
        annotations:
            sql_identifier: "uq_quantity_value"

    # Probability distributions and intervals
    UncertaintyDistribution:
        class_uri: uq:uncertaintyDistribution
        description: "Probability distribution representing uncertainty for a measurand, input quantity, component, or model output"
        slots:
            - distribution_identifier_value
            - distribution_type_value
            - distribution_parameters
            - distribution_lower_bound_value
            - distribution_upper_bound_value
            - distribution_mean_value
            - distribution_median_value
            - distribution_standard_deviation_value
            - distribution_location_value
            - distribution_scale_value
            - empirical_values_reference_value
            - distribution_notes_value
        annotations:
            references: "JCGM 101:2008; JCGM GUM-6:2020"
            sql_identifier: "uq_distribution"

    DistributionParameter:
        class_uri: uq:distributionParameter
        description: "Name-value-unit parameter used to define a probability distribution"
        slots:
            - distribution_parameter_name_value
            - distribution_parameter_value_value
            - distribution_parameter_unit_value
        annotations:
            sql_identifier: "uq_distribution_parameter"

    UncertaintyInterval:
        class_uri: uq:uncertaintyInterval
        description: "Interval representation of uncertainty, including coverage intervals and percentile intervals"
        slots:
            - interval_type_value
            - lower_bound_value
            - upper_bound_value
            - uncertainty_unit_value
            - coverage_probability_value
            - coverage_factor_value
            - percentile_lower_value
            - percentile_upper_value
        annotations:
            references: "JCGM 100:2008; JCGM 101:2008; JCGM 200:2012"
            sql_identifier: "uq_interval"

    # Budgets, components, and correlations
    UncertaintyBudget:
        class_uri: uq:uncertaintyBudget
        description: "Statement of uncertainty components, their calculation, and their combination"
        slots:
            - uncertainty_budget_identifier_value
            - uncertainty_budget_name_value
            - measurement_model_value
            - budget_method_value
            - input_quantities
            - uncertainty_components
            - correlations
            - combined_standard_uncertainty_value
            - relative_standard_uncertainty_value
            - expanded_uncertainty_value
            - coverage_factor_value
            - coverage_probability_value
            - effective_degrees_of_freedom_value
            - coverage_interval
            - uncertainty_standards_applied_value
            - uncertainty_statement_notes_value
        annotations:
            references: "JCGM 100:2008; JCGM 200:2012"
            sql_identifier: "uq_budget"

    InputQuantity:
        class_uri: uq:inputQuantity
        description: "Input quantity in a measurement, calculation, or statistical model"
        slots:
            - input_quantity_identifier_value
            - input_quantity_name_value
            - input_quantity_estimate_value
            - input_quantity_unit_value
            - standard_uncertainty_value
            - relative_standard_uncertainty_value
            - probability_distribution
            - uncertainty_traceability_reference_value
            - uncertainty_data_quality_reference_value
            - uncertainty_evidence_reference_value
        annotations:
            references: "JCGM 100:2008; JCGM 101:2008"
            sql_identifier: "uq_input_quantity"

    UncertaintyComponent:
        class_uri: uq:uncertaintyComponent
        description: "Individual contribution to uncertainty from a source, input, bias, model discrepancy, scenario, or data quality limitation"
        slots:
            - uncertainty_component_identifier_value
            - uncertainty_source_value
            - uncertainty_source_category_value
            - evaluation_type_value
            - component_estimate_value
            - standard_uncertainty_value
            - relative_standard_uncertainty_value
            - sensitivity_coefficient_value
            - degrees_of_freedom_value
            - coverage_factor_value
            - coefficient_of_variation_value
            - uncertainty_component_factor_value
            - probability_distribution
            - uncertainty_traceability_reference_value
            - uncertainty_data_quality_reference_value
            - uncertainty_evidence_reference_value
            - uncertainty_statement_notes_value
        annotations:
            references: "JCGM 100:2008; JCGM 200:2012; ISO 5725; ISO/TS 21748"
            sql_identifier: "uq_component"

    Correlation:
        class_uri: uq:correlation
        description: "Correlation or covariance relationship between input quantities or uncertainty components"
        slots:
            - correlation_identifier_value
            - first_quantity_reference_value
            - second_quantity_reference_value
            - correlation_coefficient_value
            - covariance_value
            - correlation_basis_value
        annotations:
            references: "JCGM 100:2008; JCGM 101:2008"
            sql_identifier: "uq_correlation"

    # Propagation, sensitivity, scenarios, and comparison
    PropagationAnalysis:
        class_uri: uq:propagationAnalysis
        description: "Analysis used to propagate input uncertainties to an output uncertainty statement"
        slots:
            - propagation_identifier_value
            - propagation_method_value
            - model_equation_value
            - simulation_runs_value
            - random_seed_value
            - software_reference_value
            - analysis_timestamp_value
            - output_distribution
            - output_interval
            - sensitivity_results
            - scenario_uncertainties
            - uncertainty_standards_applied_value
            - uncertainty_statement_notes_value
        annotations:
            references: "JCGM 100:2008; JCGM 101:2008; JCGM GUM-6:2020; JCGM GUM-1:2023"
            sql_identifier: "uq_propagation"

    SensitivityResult:
        class_uri: uq:sensitivityResult
        description: "Sensitivity metric for identifying uncertainty drivers and quality hotspots"
        slots:
            - sensitivity_parameter_value
            - sensitivity_metric_value
            - sensitivity_value_value
            - sensitivity_rank_value
            - quality_hotspot_flag_value
            - uncertainty_data_quality_reference_value
            - uncertainty_traceability_reference_value
            - uncertainty_statement_notes_value
        annotations:
            references: "JCGM 101:2008"
            sql_identifier: "uq_sensitivity_result"

    ScenarioUncertainty:
        class_uri: uq:scenarioUncertainty
        description: "Scenario-specific uncertainty context for structural, boundary, allocation, or modelling alternatives"
        slots:
            - scenario_identifier_value
            - scenario_name_value
            - scenario_description_value
            - scenario_boundary_value
            - scenario_probability_value
            - probability_distribution
            - coverage_interval
            - uncertainty_traceability_reference_value
            - uncertainty_data_quality_reference_value
            - uncertainty_statement_notes_value
        annotations:
            references: "JCGM 101:2008; ISO 14040; ISO 14044"
            sql_identifier: "uq_scenario_uncertainty"

    ComparisonAssessment:
        class_uri: uq:comparisonAssessment
        description: "Assessment of whether two uncertainty-backed values can be compared meaningfully"
        slots:
            - comparison_identifier_value
            - left_statement_reference_value
            - right_statement_reference_value
            - traceability_match_value
            - boundary_match_value
            - comparison_decision_value
            - additional_uncertainty_rationale_value
            - additional_uncertainty_component
            - uncertainty_statement_notes_value
        annotations:
            references: "JCGM 100:2008; JCGM 101:2008; ISO/IEC 17025"
            sql_identifier: "uq_comparison_assessment"

    # Method and evidence support
    MethodReference:
        class_uri: uq:methodReference
        description: "Reference to a method, guide, standard, protocol, or implementation used for uncertainty evaluation"
        slots:
            - method_reference_identifier_value
            - method_reference_url_value
            - method_reference_description_value
            - method_standard_value
            - method_version_value
        annotations:
            sql_identifier: "uq_method_reference"

    UncertaintyEvidenceReference:
        class_uri: uq:evidenceReference
        description: "Reference to supporting evidence used to define, justify, or update uncertainty"
        slots:
            - uncertainty_evidence_identifier_value
            - uncertainty_evidence_type_value
            - uncertainty_evidence_url_value
            - uncertainty_evidence_description_value
            - uncertainty_evidence_date_value
            - uncertainty_evidence_provider_value
            - uncertainty_evidence_version_value
        annotations:
            sql_identifier: "uq_evidence_reference"

enums:
    UncertaintyStatementTypeEnum:
        description: "Types of uncertainty statement supported by the model"
        permissible_values:
            measurement_uncertainty:
                description: "Uncertainty associated with a measurement result"
            parameter_uncertainty:
                description: "Uncertainty associated with an input parameter or model parameter"
            model_uncertainty:
                description: "Uncertainty associated with a model structure, model discrepancy, or modelling assumption"
            scenario_uncertainty:
                description: "Uncertainty associated with a scenario, system boundary, allocation rule, or structural choice"
            data_quality_derived_uncertainty:
                description: "Uncertainty derived from data quality scores, pedigree information, or data quality limitations"
            comparison_uncertainty:
                description: "Uncertainty introduced or assessed when comparing two values or studies"
            combined_uncertainty:
                description: "Combined uncertainty that integrates multiple sources or uncertainty types"

    StatementStatusEnum:
        description: "Lifecycle status values for uncertainty statements"
        permissible_values:
            draft:
                description: "Statement is provisional"
            reported:
                description: "Statement is reported for use"
            revised:
                description: "Statement has been revised after new evidence or assumptions"
            superseded:
                description: "Statement has been superseded by a newer statement"
            withdrawn:
                description: "Statement has been withdrawn"

    ValueTypeEnum:
        description: "Types of values that may carry uncertainty"
        permissible_values:
            measured_value:
                description: "Value obtained by measurement"
            calculated_value:
                description: "Value obtained by calculation"
            estimated_value:
                description: "Value obtained by estimation"
            simulated_value:
                description: "Value obtained by simulation"
            categorical_value:
                description: "Categorical or classification value"
            interval_value:
                description: "Value represented primarily as an interval"

    DistributionTypeEnum:
        description: "Probability distribution types used to represent uncertainty"
        permissible_values:
            normal:
                description: "Normal or Gaussian distribution"
            lognormal:
                description: "Lognormal distribution"
            triangular:
                description: "Triangular distribution"
            uniform:
                description: "Uniform distribution"
            rectangular:
                description: "Rectangular distribution as used in uncertainty evaluation"
            student_t:
                description: "Student t distribution"
            beta:
                description: "Beta distribution"
            gamma:
                description: "Gamma distribution"
            exponential:
                description: "Exponential distribution"
            empirical:
                description: "Empirical distribution defined by observed or simulated values"
            discrete:
                description: "Discrete probability distribution"
            multimodal:
                description: "Distribution with multiple modes"
            custom:
                description: "Custom distribution defined outside this controlled vocabulary"

    IntervalTypeEnum:
        description: "Interval types used to report uncertainty"
        permissible_values:
            coverage_interval:
                description: "Coverage interval with an associated coverage probability"
            expanded_uncertainty_interval:
                description: "Interval derived from expanded uncertainty"
            percentile_interval:
                description: "Interval defined by lower and upper percentiles"
            credible_interval:
                description: "Bayesian credible interval"
            tolerance_interval:
                description: "Tolerance interval"
            decision_interval:
                description: "Interval used for a decision or conformity assessment"

    UncertaintySourceCategoryEnum:
        description: "Categories of uncertainty sources"
        permissible_values:
            repeatability:
                description: "Short-term variability under repeatability conditions"
            reproducibility:
                description: "Variability across laboratories, operators, instruments, sites, or times"
            calibration:
                description: "Uncertainty from calibration or calibration hierarchy"
            reference_material:
                description: "Uncertainty from certified or reference material values"
            resolution:
                description: "Uncertainty from instrument or reporting resolution"
            environmental_condition:
                description: "Uncertainty from environmental or procedural conditions"
            sampling:
                description: "Uncertainty from sampling design, sample selection, or representativeness"
            sample_preparation:
                description: "Uncertainty from specimen preparation, extraction, homogenization, or conditioning"
            method_bias:
                description: "Uncertainty from method bias or imperfect correction"
            recovery:
                description: "Uncertainty from recovery, blank, matrix, or transfer effects"
            drift:
                description: "Uncertainty from drift over time"
            model_discrepancy:
                description: "Uncertainty from difference between the model and the represented system"
            data_quality:
                description: "Uncertainty from data quality limitations or proxy data"
            boundary_condition:
                description: "Uncertainty from scope, boundary, or reference condition choices"
            scenario_choice:
                description: "Uncertainty from discrete scenario or structural choices"
            input_data:
                description: "Uncertainty from input data values or datasets"
            software:
                description: "Uncertainty from software, numerical implementation, or computational workflow"
            other:
                description: "Other uncertainty source category"

    EvaluationTypeEnum:
        description: "Evaluation types for uncertainty components"
        permissible_values:
            type_a:
                description: "Type A evaluation by statistical analysis of measured quantity values"
            type_b:
                description: "Type B evaluation by means other than Type A"
            mixed:
                description: "Combination of Type A and Type B information"
            data_quality_derived:
                description: "Evaluation derived from data quality assessment"
            expert_judgement:
                description: "Evaluation based on expert judgement"
            scenario_based:
                description: "Evaluation based on scenario or structural alternatives"

    PropagationMethodEnum:
        description: "Methods for uncertainty combination or propagation"
        permissible_values:
            analytical_gum:
                description: "Analytical propagation following GUM principles"
            monte_carlo:
                description: "Monte Carlo propagation of distributions"
            bayesian_updating:
                description: "Bayesian updating or Bayesian modelling"
            bootstrap:
                description: "Bootstrap or resampling-based propagation"
            sensitivity_analysis:
                description: "Sensitivity analysis used to evaluate uncertainty drivers"
            scenario_analysis:
                description: "Scenario analysis for structural or boundary alternatives"
            hybrid:
                description: "Combination of multiple propagation approaches"
            not_evaluated:
                description: "Propagation method has not been evaluated or is unknown"

    TraceabilityMatchEnum:
        description: "Compatibility of traceability bases for comparison"
        permissible_values:
            matching:
                description: "Traceability bases match"
            compatible:
                description: "Traceability bases are compatible for the intended comparison"
            partial:
                description: "Traceability bases partially match"
            divergent:
                description: "Traceability bases diverge materially"
            not_assessed:
                description: "Traceability compatibility has not been assessed"

    BoundaryMatchEnum:
        description: "Compatibility of method, scope, or system boundaries for comparison"
        permissible_values:
            matching:
                description: "Boundaries match"
            compatible:
                description: "Boundaries are compatible for the intended comparison"
            partial:
                description: "Boundaries partially match"
            divergent:
                description: "Boundaries diverge materially"
            not_assessed:
                description: "Boundary compatibility has not been assessed"

    ComparisonDecisionEnum:
        description: "Decisions about whether uncertainty-backed values can be compared"
        permissible_values:
            direct_comparison_valid:
