enums:
    CommitmentCategoryType:
        description: Types of commitment categories
        permissible_values:
            REGULATORY:
                description: Legally required regulatory commitment
                annotations:
                    sql_identifier: comp_cat_regulatory
                    owl.filler: schema:LegislationObject
                    references: "ESPR; REACH Regulation (EC) No 1907/2006; RoHS Directive 2011/65/EU; Product Safety Directive; Ecodesign Directive 2009/125/EC; CLP Regulation (EC) No 1272/2008"
            VOLUNTARY:
                description: Voluntary commitment beyond legal requirements
                annotations:
                    sql_identifier: comp_cat_voluntary
                    owl.filler: schema:voluntaryCommitment
                    references: "King et al.; CIRPASS"
            CONTRACTUAL:
                description: Commitment arising from contractual obligations
                annotations:
                    sql_identifier: comp_cat_contractual
                    owl.filler: schema:Contract
            INDUSTRY_STANDARD:
                description: Industry standard or best practice commitment
                annotations:
                    sql_identifier: comp_cat_industry
                    owl.filler: schema:industry
                    references: "King et al.; Jensen et al."
            CUSTOMER_REQUIREMENT:
                description: Specific customer requirement
                annotations:
                    sql_identifier: comp_cat_customer
                    owl.filler: schema:customer
            ENVIRONMENTAL:
                description: Environmental commitment
                annotations:
                    sql_identifier: comp_cat_environmental
                    owl.filler: envo:environmental_system
                    references: "King et al.; Berger et al.; Battery Pass"
            SOCIAL:
                description: Social responsibility commitment
                annotations:
                    sql_identifier: comp_cat_social
                    owl.filler: schema:socialResponsibility
                    references: "King et al."
            QUALITY:
                description: Quality-related commitment
                annotations:
                    sql_identifier: comp_cat_quality
                    owl.filler: schema:quality
                    references: "King et al.; CIRPASS"

    ComplianceStatusType:
        description: Types of compliance status
        permissible_values:
            MANDATORY:
                description: Mandatory requirement in this jurisdiction
                annotations:
                    sql_identifier: comp_stat_mandatory
            VOLUNTARY:
                description: Voluntary in this jurisdiction
                annotations:
                    sql_identifier: comp_stat_voluntary
            RECOMMENDED:
                description: Recommended but not required
                annotations:
                    sql_identifier: comp_stat_recommended
            OPTIONAL:
                description: Optional requirement
                annotations:
                    sql_identifier: comp_stat_optional
            NOT_APPLICABLE:
                description: Not applicable in this jurisdiction
                annotations:
                    sql_identifier: comp_stat_na
            PENDING:
                description: Pending regulatory decision
                annotations:
                    sql_identifier: comp_stat_pending
            SUPERSEDED:
                description: Superseded by newer requirement
                annotations:
                    sql_identifier: comp_stat_superseded
            TRANSITIONAL:
                description: In transitional period
                annotations:
                    sql_identifier: comp_stat_transitional

    RequirementType:
        description: Types of requirements
        permissible_values:
            REGULATION:
                description: Legal regulation
                annotations:
                    sql_identifier: comp_reqtype_regulation
                    owl.filler: schema:Legislation
                    references: "ESPR; Product Safety Directive"
            DIRECTIVE:
                description: Legal directive
                annotations:
                    sql_identifier: comp_reqtype_directive
                    owl.filler: schema:LegislationObject
                    references: "Ecodesign Directive; Energy Labelling Directive"
            STANDARD:
                description: Technical standard
                annotations:
                    sql_identifier: comp_reqtype_standard
                    owl.filler: dcterms:Standard
                    references: "ISO standards; EN standards"
            SPECIFICATION:
                description: Technical specification
                annotations:
                    sql_identifier: comp_reqtype_specification
                    owl.filler: schema:TechArticle
            GUIDELINE:
                description: Guideline or guidance document
                annotations:
                    sql_identifier: comp_reqtype_guideline
                    owl.filler: schema:Guide
            TECHNICAL_REPORT:
